name: Park Visit Telegram Alert

on:
  schedule:
    - cron: '0 * * * *'  # Every hour
  workflow_dispatch:        # manual trigger

jobs:
  run-script:
    # Set repository variable ENABLE_PARK_VISIT_ALERT to "false" to skip scheduled runs.
    # workflow_dispatch always runs so you can test without changing the flag.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ENABLE_PARK_VISIT_ALERT != 'false' }}
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    # PARK_VISIT_TARGET_DATES: add Actions secret or variable named PARK_VISIT_TARGET_DATES (comma-separated YYYY-MM-DD)
    # PARK_ITEM_ID: add Actions secret or variable named PARK_ITEM_ID (comma-separated Checkfront item IDs)
    # PARK_CATEGORY_ID: add Actions secret or variable named PARK_CATEGORY_ID
    - name: Run script
      env:
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        PARK_VISIT_TARGET_DATES: ${{ secrets.PARK_VISIT_TARGET_DATES || vars.PARK_VISIT_TARGET_DATES }}
        PARK_ITEM_ID: ${{ secrets.PARK_ITEM_ID || vars.PARK_ITEM_ID }}
        PARK_CATEGORY_ID: ${{ secrets.PARK_CATEGORY_ID || vars.PARK_CATEGORY_ID }}
      run: python parksVisitTelegramBot.py
