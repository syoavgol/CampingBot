name: Park Visit Telegram Alert

on:
  schedule:
    - cron: '0 * * * *'  # Every hour
  workflow_dispatch:        # manual trigger

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    # PARK_VISIT_TARGET_DATES: add Actions secret or variable named PARK_VISIT_TARGET_DATES (comma-separated YYYY-MM-DD)
    - name: Run script
      env:
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        PARK_VISIT_TARGET_DATES: ${{ secrets.PARK_VISIT_TARGET_DATES || vars.PARK_VISIT_TARGET_DATES }}
      run: python parksVisitTelegramBot.py
