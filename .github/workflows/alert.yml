name: Yarkon Telegram Alert

on:
  schedule:
    - cron: '0 5,17 * * *'  # 08:00 and 20:00 Israel time (UTC+3, summer)
  workflow_dispatch:        # manual trigger

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cloudscraper requests

    # TARGET_DATES: add Actions secret or variable named TARGET_DATES (comma-separated YYYY-MM-DD)
    - name: Run script
      env:
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        TARGET_DATES: ${{ secrets.TARGET_DATES || vars.TARGET_DATES }}
        HOTEL_ID: ${{ secrets.HOTEL_ID || vars.HOTEL_ID }}
      run: python parksTelegramBot.py
