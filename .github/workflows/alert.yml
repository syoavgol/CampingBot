name: Yarkon Telegram Alert

on:
  schedule:
    - cron: '0 5,17 * * *'  # 08:00 and 20:00 Israel time (UTC+3, summer)
  workflow_dispatch:        # manual trigger

jobs:
  run-script:
    # Set repository variable ENABLE_CAMPING_ALERT to "false" to skip scheduled runs.
    # workflow_dispatch always runs so you can test without changing the flag.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ENABLE_CAMPING_ALERT != 'false' }}
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cloudscraper requests

    # CAMPING_TARGET_DATES: add Actions secret or variable named CAMPING_TARGET_DATES (comma-separated YYYY-MM-DD)
    - name: Run script
      env:
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        CAMPING_TARGET_DATES: ${{ secrets.CAMPING_TARGET_DATES || vars.CAMPING_TARGET_DATES }}
        HOTEL_ID: ${{ secrets.HOTEL_ID || vars.HOTEL_ID }}
      run: python parksTelegramBot.py
